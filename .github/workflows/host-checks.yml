name: Public host contracts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-contracts:
    runs-on: ubuntu-24.04
    # Cold codec/document setup installs about 300 packages. Allow its bounded
    # download window plus the clean build and unchanged contract checks.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Ensure host dependencies
        timeout-minutes: 18
        run: |
          packages=()
          command -v g++-14 >/dev/null || packages+=(g++-14)
          command -v cmake >/dev/null || packages+=(cmake)
          test -f /usr/include/openssl/ssl.h || packages+=(libssl-dev)
          test -f /usr/include/archive.h || packages+=(libarchive-dev)
          test -f /usr/include/webp/decode.h || packages+=(libwebp-dev)
          test -f /usr/include/zlib.h || packages+=(zlib1g-dev)
          test -f /usr/include/libxml2/libxml/xmlreader.h || packages+=(libxml2-dev)
          test -f /usr/include/LibreOfficeKit/LibreOfficeKit.h || packages+=(libreofficekit-dev)
          command -v pkg-config >/dev/null || packages+=(pkg-config)
          for codec in libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
              gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
              gstreamer1.0-plugins-bad; do
            dpkg-query -W -f='${Status}' "$codec" 2>/dev/null | \
              grep -q 'install ok installed' || packages+=("$codec")
          done
          for codec in libreoffice-writer libreoffice-calc libreoffice-impress; do
            dpkg-query -W -f='${Status}' "$codec" 2>/dev/null | \
              grep -q 'install ok installed' || packages+=("$codec")
          done
          command -v pdftoppm >/dev/null || packages+=(poppler-utils)
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf || packages+=(fonts-dejavu-core)
          dpkg-query -W -f='${Status}' libidn2-0 2>/dev/null | \
            grep -q 'install ok installed' || packages+=(libidn2-0)
          command -v openssl >/dev/null || packages+=(openssl)
          command -v strace >/dev/null || packages+=(strace)
          /usr/bin/python3 -c 'import numpy' || packages+=(python3-numpy)
          /usr/bin/python3 -c 'import ensurepip' || packages+=(python3-venv)
          if ((${#packages[@]})); then
            # The hosted regional mirror repeatedly stalled during cold
            # dependency downloads. Use Ubuntu's official archive on this
            # disposable runner; retain signed sources and all apt checks.
            if test -f /etc/apt/apt-mirrors.txt; then
              printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' |
                sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            fi
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 \
              install -y --no-install-recommends "${packages[@]}"
          fi
          g++-14 --version
          cmake --version
          /usr/bin/python3 -c 'import numpy; print(numpy.__version__)'
      - name: Protect runner system document resources
        run: |
          # Hosted images can make codec resource directories world-writable.
          # Restore trusted read-only resources; never weaken the sandbox.
          for path in /usr/share/fonts /usr/share/fontconfig \
              /usr/share/libreoffice /etc/libreoffice /usr/share/locale \
              /usr/share/mime /usr/share/zoneinfo /etc/localtime; do
            test -e "$path" || continue
            test "$(stat -Lc '%u' "$path")" = 0
            stat -Lc 'before %n owner=%u mode=%a' "$path"
            sudo chmod go-w "$path"
            stat -Lc 'after %n owner=%u mode=%a' "$path"
          done
      - name: Install pinned SDK for native TLS client contracts
        timeout-minutes: 2
        run: |
          node -e 'if (Number(process.versions.node.split(".")[0]) < 22) process.exit(1)'
          mkdir -p build/public-host/sdk
          cp tools/serve_protocol/package.json tools/serve_protocol/package-lock.json build/public-host/sdk/
          npm ci --prefix build/public-host/sdk --ignore-scripts --no-audit --no-fund
      - name: Install pinned schema validation tools
        timeout-minutes: 2
        run: |
          /usr/bin/python3 -m venv build/public-host/schema-venv
          build/public-host/schema-venv/bin/python -m pip install \
            --disable-pip-version-check --retries 1 --timeout 20 \
            -r tools/serve_protocol/requirements-schema.txt
      - name: Describe document sandbox prerequisites
        timeout-minutes: 1
        run: |
          g++-14 -std=c++23 -Wall -Wextra -Werror -Iinclude \
            tools/verify/host_sandbox_probe.cpp \
            src/server/file_document_sandbox.cpp src/server/file_pdf_sandbox.cpp \
            src/server/file_legacy_sandbox.cpp -o build/public-host/sandbox-probe
          timeout 15s build/public-host/sandbox-probe build/public-host/sandbox-diagnostics |
            while IFS= read -r line; do echo "::notice title=Document sandbox::$line"; done
      - name: Configure without CUDA or model fixtures
        run: >-
          cmake -S tests/host -B build/public-host
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14
          -DPython3_EXECUTABLE=/usr/bin/python3
      - name: Build with warnings as errors
        run: cmake --build build/public-host --parallel 2
      - name: Run all public host contracts
        run: >-
          ctest --test-dir build/public-host --no-tests=error
          --output-on-failure --verbose
      - name: Diagnose document worker failure
        if: failure()
        timeout-minutes: 1
        run: |
          test -x build/public-host/q4t_host_tests || exit 0
          mkdir -p build/public-host/codec-diagnostic
          export Q4T_TEST_OUTPUT_DIR="$PWD/build/public-host/codec-diagnostic"
          export TMPDIR="$Q4T_TEST_OUTPUT_DIR"
          printf '%s\n' file_legacy_actual_doc_unicode_and_confirmed_cleanup \
            > build/public-host/codec-diagnostic/required.txt
          # Diagnostic only: the failed contract above remains failed. Trace
          # system calls, never document contents or credentials.
          set +e
          timeout 30s strace -ff -s 128 -e trace=%file,%process,%signal,%memory \
            -o build/public-host/codec-diagnostic/trace \
            build/public-host/q4t_host_tests --required-list \
            build/public-host/codec-diagnostic/required.txt
          result=$?
          echo "diagnostic_exit=$result"
          for trace in build/public-host/codec-diagnostic/trace.*; do
            test -f "$trace" || continue
            echo "trace_file=$trace"
            tail -50 "$trace"
          done
      - name: Verify strict test-runner failures
        run: >-
          python3 tools/verify/test_gate/run.py --cxx g++-14
          --output build/public-host/test-gate
      - name: Check frozen host evidence audit
        run: python3 -B tools/release/test_host_gate_audit.py
      - name: Check reversible version-registration retention
        timeout-minutes: 2
        env:
          Q4T_TEST_OUTPUT_DIR: ${{ github.workspace }}/.q4t-work/version-archive-cpu
        run: python3 -B -m unittest tools.serve_recovery.test_version_archive
      - name: Check root rollback state and sealed source contracts
        timeout-minutes: 3
        env:
          Q4T_TEST_OUTPUT_DIR: ${{ github.workspace }}/.q4t-work/root-rollback-cpu
        run: >-
          python3 -B -m unittest
          tools.serve_recovery.test_root_version_policy
          tools.serve_recovery.test_root_transfer
          tools.serve_recovery.test_root_checkpoint_archive
          tools.serve_recovery.test_native_bundle.BundleTests.test_v2_source_inventory_is_frozen_and_cannot_claim_isolated_io
          tools.serve_recovery.test_native_bundle.BundleTests.test_historical_source_inventory_versions_remain_verifiable
          tools.serve_recovery.test_native_bundle.BundleTests.test_relocated_v18_source_imports_every_cold_management_module
          tools.serve_recovery.test_native_bundle.BundleTests.test_relocated_current_contains_complete_outer_resume_and_root_transfer_sources
      - name: Check serve surface inventory freshness
        run: python3 -B tools/serve_audit/check_inventory.py --self-check
      - name: Check native recovery wait and root migration preservation
        timeout-minutes: 2
        env:
          Q4T_GUARDIAN_BINARY: ${{ github.workspace }}/build/public-host/q4t-guardian
          Q4T_TEST_OUTPUT_DIR: ${{ github.workspace }}/.q4t-work/recovery-wait-cpu
        run: >-
          python3 -B -m unittest
          tools.serve_recovery.test_recovery_wait
          tools.serve_recovery.test_root_contract
          tools.serve_recovery.test_acceptance_wait
      - name: Check qualified audio auxiliary recovery and migrations
        timeout-minutes: 2
        env:
          Q4T_TEST_OUTPUT_DIR: ${{ github.workspace }}/.q4t-work/audio-recovery-cpu
        run: >-
          python3 -B -m unittest
          tools.serve_recovery.test_audio_auxiliary_profiles.AudioAuxiliaryProfiles
          tools.serve_recovery.test_speaker_profiles.SpeakerProfiles
          tools.serve_service.test_audio_auxiliary_package.AudioAuxiliaryPackage
          tools.serve_recovery.test_asr_profiles.AsrProfiles
          tools.serve_recovery.test_chat_audio_profiles.ChatAudioProfiles
          tools.native_asr.test_auxiliary_service
          tools.native_asr.test_recovery_profiles.RecoveryProfiles
          tools.native_speaker.test_service
      - name: Check native speech qualification and active cancellation contracts
        timeout-minutes: 3
        env:
          Q4T_TEST_OUTPUT_DIR: ${{ github.workspace }}/.q4t-work/tts-recovery-cpu
        run: >-
          python3 -B -m unittest
          tools.serve_recovery.test_tts_profiles.TtsProfiles
          tools.serve_service.test_tts_package.TtsPackage
          tools.native_tts.test_managed_service.ManagedSpeech
          tools.native_asr.test_active_cancellation.ActiveCancellation
      - name: Check registered voices and persistent recovery contracts
        timeout-minutes: 3
        env:
          CUDA_VISIBLE_DEVICES: ""
          Q4T_TEST_OUTPUT_DIR: ${{ github.workspace }}/.q4t-work/voice-recovery-cpu
        run: >-
          python3 -B -m unittest
          tools.serve_service.test_voice_package.VoicePackage
          tools.serve_recovery.test_voice_profiles.VoiceProfiles
          tools.serve_recovery.test_profile_voice.VoiceDriver
          tools.serve_recovery.test_tts_checkpoint_profiles.CheckpointWitness
          tools.native_tts.test_managed_voice
          tools.native_tts.test_managed_review
          tools.native_tts.test_voice_sdk_acceptance.VoiceSdkDriver
      - name: Check cold acceptance package provenance
        timeout-minutes: 1
        run: python3 -B -m unittest tools.serve_recovery.test_cold_package
      - name: Check native soak handoff contracts and owned cleanup
        timeout-minutes: 1
        run: python3 -B -m unittest tools.serve_soak.test_native_soak
      - name: Check JavaScript schema input contracts
        run: node --test tools/examples/js/test_schema_client.mjs
      - name: Check Chat citation history schemas and clients
        run: >-
          build/public-host/schema-venv/bin/python -B -m unittest
          tools.serve_protocol.test_chat_annotations
      - name: Check Chat moderation schemas and client publication
        run: >-
          build/public-host/schema-venv/bin/python -B -m unittest
          tools.serve_protocol.test_chat_moderation
      - name: Check SDK bridge and persistent response receipts
        timeout-minutes: 1
        env:
          Q4T_NODE_SDK_DIR: ${{ github.workspace }}/build/public-host/sdk
          Q4T_TEST_OUTPUT_DIR: ${{ github.workspace }}/build/public-host/client-receipts
        run: python3 -B -m unittest tools.serve_protocol.test_client_receipts
      - name: Check reversible publication intent retention
        timeout-minutes: 2
        env:
          Q4T_TEST_OUTPUT_DIR: ${{ github.workspace }}/.q4t-work/intent-archive-cpu
        run: >-
          python3 -B -m unittest
          tools.serve_recovery.test_publication_intent_archive
      - name: Check native service retention commands
        timeout-minutes: 3
        env:
          Q4T_TEST_OUTPUT_DIR: ${{ github.workspace }}/.q4t-work/maintenance-cpu
        run: python3 -B -m unittest tools.serve_recovery.test_maintenance
