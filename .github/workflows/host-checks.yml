name: Public host contracts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Ensure host dependencies
        timeout-minutes: 6
        run: |
          packages=()
          command -v g++-14 >/dev/null || packages+=(g++-14)
          command -v cmake >/dev/null || packages+=(cmake)
          test -f /usr/include/openssl/ssl.h || packages+=(libssl-dev)
          test -f /usr/include/archive.h || packages+=(libarchive-dev)
          test -f /usr/include/libxml2/libxml/xmlreader.h || packages+=(libxml2-dev)
          test -f /usr/include/LibreOfficeKit/LibreOfficeKit.h || packages+=(libreofficekit-dev)
          for codec in libreoffice-writer libreoffice-calc libreoffice-impress; do
            dpkg-query -W -f='${Status}' "$codec" 2>/dev/null | \
              grep -q 'install ok installed' || packages+=("$codec")
          done
          command -v pdftoppm >/dev/null || packages+=(poppler-utils)
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf || packages+=(fonts-dejavu-core)
          dpkg-query -W -f='${Status}' libidn2-0 2>/dev/null | \
            grep -q 'install ok installed' || packages+=(libidn2-0)
          command -v openssl >/dev/null || packages+=(openssl)
          /usr/bin/python3 -c 'import numpy' || packages+=(python3-numpy)
          if ((${#packages[@]})); then
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 \
              install -y --no-install-recommends "${packages[@]}"
          fi
          g++-14 --version
          cmake --version
          /usr/bin/python3 -c 'import numpy; print(numpy.__version__)'
      - name: Configure without CUDA or model fixtures
        run: >-
          cmake -S tests/host -B build/public-host
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14
          -DPython3_EXECUTABLE=/usr/bin/python3
      - name: Build with warnings as errors
        run: cmake --build build/public-host --parallel 2
      - name: Run all public host contracts
        run: >-
          ctest --test-dir build/public-host --no-tests=error
          --output-on-failure --verbose
      - name: Verify strict test-runner failures
        run: >-
          python3 tools/verify/test_gate/run.py --cxx g++-14
          --output build/public-host/test-gate
      - name: Check frozen host evidence audit
        run: python3 -B tools/release/test_host_gate_audit.py
      - name: Check serve surface inventory freshness
        run: python3 -B tools/serve_audit/check_inventory.py --self-check
      - name: Check JavaScript schema input contracts
        run: node --test tools/examples/js/test_schema_client.mjs
